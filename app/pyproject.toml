[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-intelligence-app"
version = "1.0.0"
description = "CS698B Video Transcription with Confidence Analytics Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "streamlit>=1.30.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "huggingface_hub>=0.24.0",
    # Speech engine (imported directly by engine/phase20_engine.py and engine/wav2vec2_aligner.py)
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "faster-whisper>=1.0.0",
    # Pyannote diarization fallback (used when the NeMo env is unavailable; needs HF_TOKEN)
    "pyannote.audio>=3.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "backend*", "adaptive*", "frontend*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
engine = [
    "faster-whisper>=1.0.0",
    "whisperx>=3.1.0",
    "pyannote.audio>=3.1.0"
]
